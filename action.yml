    - name: Record review-required incident intake
      id: intake
      shell: bash
      env:
        FL_COMMAND: ${{ inputs.command }}
        FL_FROM: ${{ inputs.from }}
        FL_TO: ${{ inputs.to }}
        FL_RUNTIME: ${{ inputs.runtime }}
        FL_DRAFT_ID: ${{ inputs.draft-id }}
      run: |
        set -euo pipefail
        doctor_report="$RUNNER_TEMP/faultline-doctor.json"
        intake_report="$RUNNER_TEMP/faultline-intake.json"
        range_candidate="$RUNNER_TEMP/faultline-event-range.txt"

        # Doctor is intentionally non-zero when proof-grade prerequisites are
        # unavailable. Retain that honest report; intake itself remains
        # review-only and does not certify a proof.
        set +e
        node "$GITHUB_ACTION_PATH/dist/cli.js" doctor --repo "$GITHUB_WORKSPACE" --json > "$doctor_report"
        doctor_status=$?
        set -e

        args=(incident start --repo "$GITHUB_WORKSPACE" --command "$FL_COMMAND")
        range_source="LOCAL_HEAD_PARENT_FALLBACK"
        if [[ -n "$FL_FROM" || -n "$FL_TO" ]]; then
          if [[ -z "$FL_FROM" || -z "$FL_TO" ]]; then
            echo "FaultLine action requires from and to together." >&2
            exit 1
          fi
          args+=(--from "$FL_FROM" --to "$FL_TO")
          range_source="EXPLICIT_ACTION_INPUT"
        else
          # GitHub's event payload is locally available to an action. Read only
          # validated commit ids from it: no API request, fetch, or CI-log
          # parsing happens here. A human still reviews/freezes the witness.
          node --input-type=module - "$GITHUB_EVENT_PATH" "$GITHUB_EVENT_NAME" "$GITHUB_SHA" > "$range_candidate" <<'NODE'
          import { readFileSync } from "node:fs";

          const [, , eventPath, eventName, githubSha] = process.argv;
          const sha = (value) => typeof value === "string" && /^[0-9a-f]{40}$/i.test(value) ? value.toLowerCase() : null;
          const nonZero = (value) => value !== null && !/^0{40}$/.test(value);
          let payload = {};
          try { payload = JSON.parse(readFileSync(eventPath, "utf8")); } catch { /* no event candidate */ }
          const emit = (from, to, source) => {
            if (nonZero(from) && nonZero(to) && from !== to) process.stdout.write(`${from}\n${to}\n${source}\n`);
          };

          if (eventName === "push") {
            emit(sha(payload.before), sha(payload.after) ?? sha(githubSha), "GITHUB_PUSH_BEFORE_AFTER");
          } else if (eventName === "pull_request" || eventName === "pull_request_target") {
            emit(sha(payload.pull_request?.base?.sha), sha(payload.pull_request?.head?.sha), "GITHUB_PULL_REQUEST_BASE_HEAD");
          } else if (eventName === "merge_group") {
            emit(sha(payload.merge_group?.base_sha), sha(payload.merge_group?.head_sha), "GITHUB_MERGE_GROUP_BASE_HEAD");
          }
        NODE
          mapfile -t event_range < "$range_candidate"
          if [[ ${#event_range[@]} -eq 3 ]]; then
            event_from="${event_range[0]}"
            event_to="${event_range[1]}"
            event_source="${event_range[2]}"
            if ! git -C "$GITHUB_WORKSPACE" cat-file -e "${event_from}^{commit}" 2>/dev/null \
              || ! git -C "$GITHUB_WORKSPACE" cat-file -e "${event_to}^{commit}" 2>/dev/null; then
              echo "FaultLine found ${event_source} from the local GitHub event, but actions/checkout did not make both commits available." >&2
              echo "Set actions/checkout fetch-depth: 0, or provide reviewed from/to inputs explicitly. FaultLine will not silently substitute another range." >&2
              exit 1
            fi
            args+=(--from "$event_from" --to "$event_to")
            range_source="$event_source"
          fi
        fi
        if [[ -n "$FL_RUNTIME" ]]; then args+=(--runtime "$FL_RUNTIME"); fi
        if [[ -n "$FL_DRAFT_ID" ]]; then args+=(--id "$FL_DRAFT_ID"); fi

        node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}" > "$intake_report"
        node --input-type=module - "$doctor_report" "$intake_report" "$GITHUB_OUTPUT" "$doctor_status" "$range_source" <<'NODE'
        import { appendFileSync, readFileSync } from "node:fs";

        const [, , doctorPath, intakePath, outputPath, doctorStatus, rangeSource] = process.argv;
        const intake = JSON.parse(readFileSync(intakePath, "utf8"));
        const lines = [
          `doctor-report=${doctorPath}`,
          `intake-report=${intakePath}`,
          `draft-path=${intake.draft.path}`,
          `proposal-id=${intake.witnessProposal.proposalId}`,
          `doctor-exit-code=${doctorStatus}`,
          `range-source=${rangeSource}`
        ];
        appendFileSync(outputPath, `${lines.join("\n")}\n`, "utf8");
        NODE
