name: Release and publish

# Auto-release on code pushes to main, then publish @mizore66/faultline to npm.
# Docs-only / benchmark-only pushes are ignored. Release commits skip re-entry.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "action.yml"
      - "actions/**"
      - "scripts/ci-bump-version.mjs"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump (ignored when publish_only)"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      publish_only:
        description: "Skip bump/tag/release; publish package.json version already on main"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: bump · tag · GitHub Release · npm publish
    runs-on: ubuntu-latest
    # Job-scoped: id-token:write is required for npm Trusted Publishing (OIDC).
    permissions:
      contents: write
      id-token: write
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        !startsWith(github.event.head_commit.message, 'chore(release):')
      )
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      # Do NOT set registry-url here — it writes an .npmrc with a placeholder
      # _authToken that makes npm skip OIDC Trusted Publishing (misleading E404).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck / test / build
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Resolve version (publish-only)
        id: existing
        if: github.event_name == 'workflow_dispatch' && inputs.publish_only
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using existing version ${VERSION}"

      - name: Bump package version
        id: bump
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_only) }}
        run: node scripts/ci-bump-version.mjs "${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}"

      - name: Pack dry-run
        run: pnpm pack --dry-run

      - name: Commit release metadata
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_only) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): ${{ steps.bump.outputs.version }}"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "FaultLine ${{ steps.bump.outputs.tag }}"
          git push origin HEAD
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Create GitHub Release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_only) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --title "FaultLine ${{ steps.bump.outputs.tag }}" \
            --notes "$(cat <<'EOF'
          Automated release from `main`.

          ## Install
          ```bash
          npm i -g @mizore66/faultline@${{ steps.bump.outputs.version }}
          fl --help
          ```

          ## Verify
          ```bash
          git checkout ${{ steps.bump.outputs.tag }}
          pnpm install --frozen-lockfile
          pnpm test
          ```

          Build Week submission pins (`v*-buildweek`) are separate from these npm semver tags.
          EOF
          )"

      - name: Publish to npm (OIDC Trusted Publishing)
        env:
          VERSION: ${{ steps.bump.outputs.version || steps.existing.outputs.version }}
        run: |
          set -euo pipefail
          echo "Publishing @mizore66/faultline@${VERSION} via OIDC"

          # Drop any auth .npmrc (setup-node registry-url / prior steps).
          # NODE_AUTH_TOKEN must stay unset so npm uses Trusted Publishing.
          rm -f .npmrc
          unset NODE_AUTH_TOKEN || true

          # Node 22 ships an npm too old for reliable OIDC; need npm ≥ 11.5.1.
          npm install -g npm@latest
          npm --version

          # Direct npm publish (not pnpm) so ACTIONS_ID_TOKEN_* reach the CLI.
          npm publish --access public --provenance

      - name: Confirm registry (best-effort; CDN can lag)
        env:
          VERSION: ${{ steps.bump.outputs.version || steps.existing.outputs.version }}
        run: |
          for i in 1 2 3 4 5 6; do
            if npm view "@mizore66/faultline@version" | grep -qx "${VERSION}"; then
              echo "Registry shows ${VERSION}"
              exit 0
            fi
            echo "Waiting for npm registry… attempt $i"
            sleep 20
          done
          echo "Warning: registry still lagging; package was published — check https://www.npmjs.com/package/@mizore66/faultline"
          exit 0
