name: Release and publish

# Auto-release on code pushes to main, then publish @mizore66/faultline to npm.
# Docs-only / benchmark-only pushes are ignored. Release commits skip re-entry.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "action.yml"
      - "actions/**"
      - "scripts/ci-bump-version.mjs"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump (ignored when publish_only)"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      publish_only:
        description: "Skip bump/tag/release; publish package.json version already on main"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: bump · tag · GitHub Release · npm publish
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        !startsWith(github.event.head_commit.message, 'chore(release):')
      )
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck / test / build
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Resolve version (publish-only)
        id: existing
        if: github.event_name == 'workflow_dispatch' && inputs.publish_only
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using existing version ${VERSION}"

      - name: Bump package version
        id: bump
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_only) }}
        run: node scripts/ci-bump-version.mjs "${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}"

      - name: Pack dry-run
        run: pnpm pack --dry-run

      - name: Commit release metadata
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_only) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): ${{ steps.bump.outputs.version }}"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "FaultLine ${{ steps.bump.outputs.tag }}"
          git push origin HEAD
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Create GitHub Release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_only) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --title "FaultLine ${{ steps.bump.outputs.tag }}" \
            --notes "$(cat <<'EOF'
          Automated release from `main`.

          ## Install
          ```bash
          npm i -g @mizore66/faultline@${{ steps.bump.outputs.version }}
          fl --help
          ```

          ## Verify
          ```bash
          git checkout ${{ steps.bump.outputs.tag }}
          pnpm install --frozen-lockfile
          pnpm test
          ```

          Build Week submission pins (`v*-buildweek`) are separate from these npm semver tags.
          EOF
          )"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version || steps.existing.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is missing. Add an Automation/publish token at repo Settings → Secrets."
            exit 1
          fi

          # setup-node writes an .npmrc that expands NODE_AUTH_TOKEN; also pin explicitly for pnpm.
          {
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"
            echo "registry=https://registry.npmjs.org/"
            echo "always-auth=true"
          } > .npmrc

          echo "Publishing @mizore66/faultline@${VERSION}"
          npm whoami || {
            echo "npm whoami failed — NPM_TOKEN is invalid or lacks access to registry.npmjs.org"
            exit 1
          }

          # Provenance needs Trusted Publishing or a token that allows it; fall back cleanly.
          set +e
          pnpm publish --access public --no-git-checks --provenance
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Published with provenance"
          else
            echo "Provenance publish failed (exit ${status}); retrying without provenance"
            pnpm publish --access public --no-git-checks
          fi

      - name: Confirm registry (best-effort; CDN can lag)
        env:
          VERSION: ${{ steps.bump.outputs.version || steps.existing.outputs.version }}
        run: |
          for i in 1 2 3 4 5 6; do
            if npm view "@mizore66/faultline@version" | grep -qx "${VERSION}"; then
              echo "Registry shows ${VERSION}"
              exit 0
            fi
            echo "Waiting for npm registry… attempt $i"
            sleep 20
          done
          echo "Warning: registry still lagging; package was published — check https://www.npmjs.com/package/@mizore66/faultline"
          exit 0
