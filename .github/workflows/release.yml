name: Release and publish

# Auto-release on code pushes to main, then publish @mizore66/faultline to npm.
# Docs-only / benchmark-only pushes are ignored. Release commits skip re-entry.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "action.yml"
      - "actions/**"
      - "scripts/ci-bump-version.mjs"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump (ignored when publish_only)"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      publish_only:
        description: "Skip bump/tag/release; publish package.json version already on main"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: bump · tag · GitHub Release · npm publish
    runs-on: ubuntu-latest
    # Job-scoped: id-token:write is required for npm Trusted Publishing (OIDC).
    permissions:
      contents: write
      id-token: write
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        !startsWith(github.event.head_commit.message, 'chore(release):')
      )
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      # Do NOT set registry-url here — it writes an .npmrc with a placeholder
      # _authToken that makes npm skip OIDC Trusted Publishing (misleading E404/ENEEDAUTH).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck / test / build
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Resolve version (publish-only)
        id: existing
        if: github.event_name == 'workflow_dispatch' && inputs.publish_only
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using existing version ${VERSION}"

      - name: Bump package version
        id: bump
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_only) }}
        run: node scripts/ci-bump-version.mjs "${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}"

      - name: Pack dry-run
        run: pnpm pack --dry-run

      - name: Commit release metadata
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_only) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): ${{ steps.bump.outputs.version }}"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "FaultLine ${{ steps.bump.outputs.tag }}"
          git push origin HEAD
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Create GitHub Release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_only) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --title "FaultLine ${{ steps.bump.outputs.tag }}" \
            --notes "$(cat <<'EOF'
          Automated release from `main`.

          ## Install
          ```bash
          npm i -g @mizore66/faultline@${{ steps.bump.outputs.version }}
          fl --help
          ```

          ## Verify
          ```bash
          git checkout ${{ steps.bump.outputs.tag }}
          pnpm install --frozen-lockfile
          pnpm test
          ```

          Build Week submission pins (`v*-buildweek`) are separate from these npm semver tags.
          EOF
          )"

      - name: Publish to npm (OIDC Trusted Publishing)
        env:
          VERSION: ${{ steps.bump.outputs.version || steps.existing.outputs.version }}
          # Intentionally omit NODE_AUTH_TOKEN — even an empty value disables OIDC.
        run: |
          set -euo pipefail
          echo "Publishing @mizore66/faultline@${VERSION} via OIDC"

          # Strip placeholder auth from every npmrc setup-node / pnpm might create.
          for cfg in \
            .npmrc \
            "${HOME}/.npmrc" \
            "${NPM_CONFIG_USERCONFIG:-}" \
            "${RUNNER_TEMP:-/tmp}/.npmrc"
          do
            [ -n "$cfg" ] && [ -f "$cfg" ] || continue
            if grep -q '_authToken\|always-auth' "$cfg" 2>/dev/null; then
              echo "Sanitizing auth lines in $cfg"
              sed -i '/_authToken/d;/always-auth/d' "$cfg"
            fi
          done
          unset NODE_AUTH_TOKEN NPM_TOKEN || true

          # Pin a known-good OIDC-capable npm and put it first on PATH.
          npm install -g npm@11.6.2
          NPM_BIN="$(npm prefix -g)/bin"
          echo "$NPM_BIN" >> "$GITHUB_PATH"
          export PATH="$NPM_BIN:$PATH"
          npm --version
          node -e "const [a,b,c]=process.versions.node.split('.').map(Number); if(a<22||(a===22&&b<14)) { console.error('Need Node >= 22.14'); process.exit(1) }"

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::ACTIONS_ID_TOKEN_* missing — job needs permissions.id-token: write"
            exit 1
          fi

          # Decode OIDC claims npm will see (no secrets printed — payload only).
          OIDC_JSON=$(curl -fsSL \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")
          OIDC_JWT=$(node -e "const j=JSON.parse(process.argv[1]); if(!j.value) process.exit(2); process.stdout.write(j.value)" "$OIDC_JSON")
          echo "OIDC claims for audience npm:registry.npmjs.org:"
          node -e '
            const t = process.argv[1];
            const p = JSON.parse(Buffer.from(t.split(".")[1], "base64url").toString());
            console.log(JSON.stringify({
              sub: p.sub,
              repository: p.repository,
              job_workflow_ref: p.job_workflow_ref,
              workflow_ref: p.workflow_ref,
              workflow: p.workflow,
              ref: p.ref,
              environment: p.environment ?? "(none)",
              aud: p.aud
            }, null, 2));
            console.log("Trusted Publisher on npmjs.com must match:");
            console.log("  org/user: Mizore66");
            console.log("  repository: faultline");
            console.log("  workflow filename: release.yml  (basename only)");
            console.log("  environment: (leave empty unless job.environment is set)");
            console.log("  allowed actions: npm publish");
          ' "$OIDC_JWT"

          # Direct exchange probe — surfaces Trusted Publisher mismatches with a real HTTP code.
          # encodeURIComponent("@scope/name") → %40scope%2Fname (must encode @, not leave it raw).
          PKG_ENC=$(node -e "process.stdout.write(encodeURIComponent('@mizore66/faultline'))")
          EXCHANGE_CODE=$(curl -sS -o /tmp/npm-oidc-exchange.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${OIDC_JWT}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${PKG_ENC}")
          echo "OIDC token exchange HTTP ${EXCHANGE_CODE} (package=${PKG_ENC})"
          # Never print the token value — only keys / error text.
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("/tmp/npm-oidc-exchange.json", "utf8"));
            if (j.token) {
              console.log("Exchange OK (token received, length=" + String(j.token).length + ")");
              fs.writeFileSync("/tmp/npm-oidc-token.txt", j.token);
            } else {
              console.log("Exchange body (no token):", JSON.stringify(j));
            }
          '

          if [ "$EXCHANGE_CODE" != "200" ] || [ ! -f /tmp/npm-oidc-token.txt ]; then
            echo "::error::npm Trusted Publisher exchange failed (HTTP ${EXCHANGE_CODE}). On https://www.npmjs.com/package/@mizore66/faultline → Settings → Trusted Publisher set exactly: org Mizore66, repo faultline, workflow release.yml, environment empty, allowed action npm publish. Do not use the workflow display name 'Release and publish'."
            exit 1
          fi

          # Prefer explicit exchange token (avoids CLI OIDC short-circuits).
          {
            echo "//registry.npmjs.org/:_authToken=$(cat /tmp/npm-oidc-token.txt)"
            echo "registry=https://registry.npmjs.org/"
          } > .npmrc
          rm -f /tmp/npm-oidc-token.txt

          npm publish --access public
          rm -f .npmrc

      - name: Confirm registry (best-effort; CDN can lag)
        env:
          VERSION: ${{ steps.bump.outputs.version || steps.existing.outputs.version }}
        run: |
          for i in 1 2 3 4 5 6; do
            if npm view "@mizore66/faultline@version" | grep -qx "${VERSION}"; then
              echo "Registry shows ${VERSION}"
              exit 0
            fi
            echo "Waiting for npm registry… attempt $i"
            sleep 20
          done
          echo "Warning: registry still lagging; package was published — check https://www.npmjs.com/package/@mizore66/faultline"
          exit 0
