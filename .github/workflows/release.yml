name: Release and publish

# Auto-release on code pushes to main, then publish @mizore66/faultline to npm.
# Docs-only / benchmark-only pushes are ignored. Release commits skip re-entry.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "action.yml"
      - "actions/**"
      - "scripts/ci-bump-version.mjs"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump (or exact x.y.z)"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: bump · tag · GitHub Release · npm publish
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        !startsWith(github.event.head_commit.message, 'chore(release):')
      )
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          # Persist credentials so the release commit + tag can push back to main.
          persist-credentials: true

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck / test / build
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Bump package version
        id: bump
        run: node scripts/ci-bump-version.mjs "${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}"

      - name: Pack dry-run
        run: pnpm pack --dry-run

      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): ${{ steps.bump.outputs.version }}"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "FaultLine ${{ steps.bump.outputs.tag }}"
          git push origin HEAD
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --title "FaultLine ${{ steps.bump.outputs.tag }}" \
            --notes "$(cat <<'EOF'
          Automated release from `main`.

          ## Install
          ```bash
          npm i -g @mizore66/faultline@${{ steps.bump.outputs.version }}
          fl --help
          ```

          ## Verify
          ```bash
          git checkout ${{ steps.bump.outputs.tag }}
          pnpm install --frozen-lockfile
          pnpm test
          ```

          Build Week submission pins (`v*-buildweek`) are separate from these npm semver tags.
          EOF
          )"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN secret is missing. Add a classic Automation/publish token at repo Settings → Secrets."
            exit 1
          fi
          # Prefer provenance when the token + package permissions allow it.
          if pnpm publish --access public --no-git-checks --provenance; then
            echo "Published with provenance"
          else
            echo "Provenance publish failed; retrying without provenance"
            pnpm publish --access public --no-git-checks
          fi

      - name: Confirm registry (best-effort; CDN can lag)
        run: |
          for i in 1 2 3 4 5 6; do
            if npm view "@mizore66/faultline@version" | grep -qx "${{ steps.bump.outputs.version }}"; then
              echo "Registry shows ${{ steps.bump.outputs.version }}"
              exit 0
            fi
            echo "Waiting for npm registry… attempt $i"
            sleep 20
          done
          echo "Warning: registry still lagging; package was published — check https://www.npmjs.com/package/@mizore66/faultline"
          exit 0
