name: Teleprompter rehearsal

# Bucket 1 #1 — machine-rehearse video commands from the signed pin until recording.
on:
  schedule:
    # Every 6 hours until submission; human can disable after video lands.
    - cron: "17 */6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/rehearse-teleprompter.mjs"
      - "docs/video-teleprompter.md"
      - ".github/workflows/teleprompter-rehearsal.yml"
  push:
    paths:
      - "scripts/rehearse-teleprompter.mjs"
      - "docs/video-teleprompter.md"
      - ".github/workflows/teleprompter-rehearsal.yml"

jobs:
  rehearse:
    name: rehearse teleprompter from pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rehearse teleprompter commands
        env:
          FAULTLINE_REHEARSE_TAG: v0.1.9-buildweek
          # Full suite already runs in Verify; keep rehearsal focused on demo commands.
          FAULTLINE_REHEARSE_SKIP_TEST: "1"
        run: node scripts/rehearse-teleprompter.mjs
      - name: Lint Devpost claims
        run: node scripts/lint-devpost-claims.mjs
