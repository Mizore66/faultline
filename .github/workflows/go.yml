name: Go

on:
  push:
  pull_request:

jobs:
  go:
    name: go test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Pinned images: ubuntu-latest moves to Ubuntu 26 on 2026-10-19, whose
        # glibc can change the directory-listing cases (KNOWN_DIFFERENCES).
        # macos-15-intel covers darwin/amd64, which no other job runs.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go vet -tags faultline_test ./...
      # Untagged first: that is what release builds see, and difftest builds
      # only with the faultline_test tag (seeded clock), so it is an empty
      # package there. Then everything tagged: the internal tests that need
      # the seeded clock, golden replay and writer replay. Golden replay runs
      # the fl binary once per invocation and git ~20k times, writer replay
      # every writer case against its golden; Windows needs well over the 10m
      # default. -count=1: replay builds cmd/fl in a subprocess, which Go's
      # test cache cannot see, so a cached PASS could hide a change to main.
      # On ubuntu-24.04 the replays also build fl with coverage and fail if
      # an error site in a gated package is never reached
      # (difftest/covergate_test.go). Only oracle tests (no Node here) and
      # per-platform cases may skip; on Windows, the writer cases marked
      # posixOnly (sh recorders, fake Docker), listed by name in
      # .github/scripts/windows-writer-skips.txt.
      # TestMkdirAllFollowsSymlinks, TestLoadRejectsSymlinkDirectoryAndOversize
      # (internal/allowlist) and TestCaptureRefusesSymlink (internal/turnsnap)
      # skip on Windows only where the runner may not create symlinks (no
      # administrator, no Developer Mode).
      # TestRemoveAllUnlinkEPERM sets the immutable flag with sudo -n chattr
      # on Linux (the runners' passwordless sudo) and must not skip.
      # TestChmodMutationAfterResetModes checks POSIX permission bits, which
      # Windows does not have.
      # Slice 5b.1 (cached demo artifacts and judge-preview) adds only the
      # symlink-eligibility names below, for the same runners that may not
      # create links (check-skips.sh matches the reported subtest name, so the
      # first two also allow exactly their named link subtests):
      # TestDemoWriterSymlinks, TestJudgePreviewSymlinks,
      # TestJudgePreviewCLISymlinks/(cli-linked-parent|cli-linked-output|
      # cli-dangling-output) and TestDemoArtifactsReplay/(writer-linked-root|
      # writer-linked-output|writer-linked-bundle-file|cli-linked-parent|
      # cli-linked-output|cli-dangling-output). A parent TestJudgePreviewCLI
      # skip is not allowed and no ordinary case may skip after a link failure.
      # Its Unix-only FIFO and mode tests are compiled only where supported
      # (they are not executed on Windows).
      # TestErrorPathReplacesLoneSurrogate pins the Unix error text (the JS
      # path string through UTF-8, as given); on Windows Node prints the
      # resolved path with backslashes (errorPath's Windows branch), which its
      # expected texts do not model.
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          status=0
          go test -count=1 -timeout 30m -v ./... | tee "$RUNNER_TEMP/go.log" || status=$?
          go test -tags faultline_test -count=1 -timeout 120m -v ./... | tee -a "$RUNNER_TEMP/go.log" || status=$?
          # ./... skips testdata, so the default-built globalopen helper package
          # (including its native ARM64 suppression regression) is run by path,
          # on Linux only, with its own timeout. Same log, status preserved, and
          # the final check-skips guard below still covers it.
          if [ "$RUNNER_OS" = Linux ]; then
            go test -count=1 -timeout 15m -v ./difftest/testdata/globalopen/ | tee -a "$RUNNER_TEMP/go.log" || status=$?
          fi
          allowed='TestLive[A-Za-z0-9]*|TestSortMatchesV8|TestToNumberMatchesNode|TestEchoRoundTripsLoneSurrogate|TestWriterSameDirectory|TestSidecarReachedFromDump|TestCoverageWindows'
          case "$RUNNER_OS" in
            macOS) allowed="$allowed|TestReadDirNamesDecodesLikeNode" ;;
            Windows)
              posix=$(tr -d '\r' < .github/scripts/windows-writer-skips.txt | grep -v '^#' | paste -sd '|' -)
              allowed="$allowed|TestReadDirNamesDecodesLikeNode|TestResolveUsesPhysicalCwd|TestCwdRemovedDirectory|TestUnnamedErrno|TestV8AbortThresholds|TestReadSizeLimitsMatchNode|TestGitVerifierLeavesNoTemporaryRepository|TestErrorPathReplacesLoneSurrogate|TestMkdirAllFollowsSymlinks|TestLoadRejectsSymlinkDirectoryAndOversize|TestCaptureRefusesSymlink|TestEnsureRealDirectoryTree|TestChmodMutationAfterResetModes|TestGoldenReplay/.+|TestDemoWriterSymlinks(/writer-linked-(root|output|bundle-file))?|TestJudgePreviewSymlinks(/(linked-parent|linked-output|dangling-output))?|TestJudgePreviewCLISymlinks/(cli-linked-parent|cli-linked-output|cli-dangling-output)|TestDemoArtifactsReplay/(writer-linked-root|writer-linked-output|writer-linked-bundle-file|cli-linked-parent|cli-linked-output|cli-dangling-output)|TestInventoryRejectsLinksInRetainedTree|TestPermissionBitsAreNotInventoried|TestAttachmentHostileRootSymlink/(minimization|repair|prevention)|TestAttachmentHostileChildSymlink/(repair|prevention)|TestServeBundleBindingLoaderRejectsLinks/(minimization/foreign-frozen\.json|cases\.jsonl|golden\.jsonl|inventory\.json|baseline\.json|\.gitattributes)|$posix" ;;
          esac
          .github/scripts/check-skips.sh "$RUNNER_TEMP/go.log" "^($allowed)\$" || status=1
          # Slice 5c: the serve-bundle Windows skips above are accepted by name
          # only here; this separate audit also requires each one's exact reason
          # (and fails any such skip on a non-Windows runner or any other skip of
          # those test families), without widening check-skips.sh.
          .github/scripts/check-serve-bundle-skip-reasons.sh "$RUNNER_TEMP/go.log" "$RUNNER_OS" || status=1
          exit $status
        env:
          FAULTLINE_COVERAGE_GATE: ${{ matrix.os == 'ubuntu-24.04' && '1' || '' }}
      - name: Release binary holds no test override
        # internal/repair's FAULTLINE_TEST_OPENAI_URL override (the Go side of
        # difftest/gen/fetch-shim.mjs) exists only in faultline_test builds.
        # The tagged build must hold it (so the grep means something) and the
        # untagged release build must not.
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/fl-release" ./cmd/fl
          go build -tags faultline_test -o "$RUNNER_TEMP/fl-tagged" ./cmd/fl
          grep -aq FAULTLINE_TEST_OPENAI_URL "$RUNNER_TEMP/fl-tagged" || { echo "::error title=override::the tagged build lost FAULTLINE_TEST_OPENAI_URL, so this check proves nothing"; exit 1; }
          if grep -aq FAULTLINE_TEST_OPENAI_URL "$RUNNER_TEMP/fl-release"; then echo "::error title=override::the release build holds FAULTLINE_TEST_OPENAI_URL"; exit 1; fi

  # The frozen TS oracle jobs (ubuntu-24.04, Node 22.22.2). The slow slice 2
  # tests run in jobs of their own, each naming its tests: check-skips.sh
  # fails a job when a named test did not report a result, so a renamed test
  # cannot drop out. difftest-live runs every other TestLive* (it lists them
  # with go test -list and leaves out the ones named here).
  difftest-goldens:
    name: difftest goldens (frozen TS oracle)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # Pinned: the collation data (ICU 78), the stack calibration
          # (internal/jsjson/stack.go) and the writer goldens follow this
          # Node release.
          node-version: "22.22.2"
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Regenerate goldens and require no drift
        # porcelain also catches untracked files (a new base's golden). The
        # writer scenarios and goldens come from this pinned Node under the
        # seed preload (difftest/gen/seed.mjs); the corpus goldens from
        # redactText on every benchmarks/secret-scanner-corpus case. Slice 4b
        # regenerates the two turn bases first (gen-bases.ts rewrites their
        # trees and packs, deterministic by construction), so a drift in the
        # turn bases fails this job too (spec 4.1); the Git bases stay
        # committed snapshots. The CLI-help metadata is validated and its
        # output regenerated from the built current-tree CLI (Slice 5a).
        # Slice 5b.1: the demo-artifacts evidence is captured once and then
        # committed, and the generator's first-capture mode deliberately
        # refuses to overwrite it, so a bare run cannot succeed in a checkout.
        # --recapture performs a complete fresh pinned-TS capture in new roots
        # and compares it byte for byte with the committed baseline, preview
        # HTML and golden.jsonl (it writes nothing); --check then validates the
        # committed evidence's structure. Neither is a skip or an accepted
        # alternative output.
        run: |
          pnpm exec tsx difftest/gen/gen-bases.ts turn-two-states turn-non-monotonic
          pnpm exec tsx difftest/gen/gen-goldens.ts
          pnpm exec tsx difftest/gen/scenarios.ts
          pnpm exec tsx difftest/gen/gen-writers.ts
          pnpm exec tsx difftest/gen/gen-corpus.ts
          pnpm exec tsx --test difftest/gen/cli-help-cases.test.ts
          pnpm exec tsx difftest/gen/gen-cli-help.ts
          pnpm exec tsx difftest/gen/gen-demo-artifacts.ts --recapture
          pnpm exec tsx difftest/gen/gen-demo-artifacts.ts --check
          # Slice 5c: the five serve-bundle support suites (fixtures, cases,
          # corpus, harness and binding) run explicitly, without touching the
          # protected package scripts. Then the original corpus (148 files) and
          # the supplemental binding corpus (10 data files) are replayed against
          # their retained inputs only: --recapture/--check build no input and
          # write nothing, so the final no-drift check below covers both.
          pnpm exec tsx --test difftest/gen/serve-bundle-fixtures.test.ts difftest/gen/serve-bundle-cases.test.ts difftest/gen/serve-bundle-corpus.test.ts difftest/gen/serve-bundle-harness.test.ts difftest/gen/serve-bundle-binding.test.ts
          pnpm exec tsx difftest/gen/gen-serve-bundle.ts --recapture
          pnpm exec tsx difftest/gen/gen-serve-bundle.ts --check
          pnpm exec tsx difftest/gen/gen-serve-bundle-binding.ts --check
          git status --porcelain difftest/testdata
          git diff --stat difftest/testdata
          test -z "$(git status --porcelain difftest/testdata)"

  difftest-live:
    name: difftest live (frozen TS oracle)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # Pinned: the collation data (ICU 78), the stack calibration
          # (internal/jsjson/stack.go) and the writer goldens follow this
          # Node release.
          node-version: "22.22.2"
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install strace
        # TestLiveFaultInjectionMatchesNode fails single syscalls with
        # strace -e inject; it fails rather than skips without strace in CI.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq strace
      - name: Live property tests
        # Every TestLive* but the ones the jobs below run. Only the cases
        # that need root may skip here; they run below. The one other
        # allowed skip is TestLiveTurnProofWriterAggregate, a manual helper
        # that skips unless FAULTLINE_TURNWRITE_AGGREGATE names retained
        # window outputs; CI does not set it, so it is listed and accounted
        # for but does not execute. Slice 3a adds
        # TestLiveSafeGitLists, TestLiveHostCmd, TestLiveConfigWriters,
        # TestLiveRuntimeMappingWriter, TestLiveCuratedRuntime,
        # TestLiveRepoDigestHelpers, TestLiveProjectContext (with the sparse
        # 256 MiB context, and as the runner user, so the unreadable file and
        # directory classes are reached: requireReached fails otherwise),
        # TestLiveProjectPrepare, TestLiveAllowlist and TestLiveTurnSnapshot*.
        # TestLiveTurnSnapshotCapture checks its markers and requireReached
        # only over all 150 cases, so FAULTLINE_TURNSNAP_CASES stays unset.
        # Slice 3b adds TestLiveIncidentSuggest, TestLiveIncidentDraft,
        # TestLivePreventionWrite, TestLiveAgentsMd and
        # TestLivePreventionFromArtifacts (about 4.5 minutes together locally,
        # most of it the TS Git proof verifier in PreventionFromArtifacts).
        # Slice 4a adds TestLiveLedgerWriters (about 35 s locally),
        # TestLiveSnapshotGC (about 6 s) and TestLiveSidecarHooks: 400 random
        # and 21 directed hook sequences and 103 stores. In podman (uid 1000)
        # the first 420 sequences ran as 17 windows of 10 to 30 sequences in 6 to
        # 13 s each, except the first 10, which hold the fresh-lock
        # sequences (about 17 s per step and side) and took 81 s; the 103
        # stores took 5 s. The full test stays well inside this step's
        # 60 minute go test timeout.
        # Slice 4b adds TestLiveTurnStates, TestLiveInvestigateTurns,
        # TestLiveTurnHashCatalog, TestLiveTurnTreesPack, TestLiveTurnSemantics,
        # TestLiveTurnProofWriter and TestLiveTurnBridge through this
        # derivation; their CI durations are not measured yet, so the job
        # timeout is not re-checked against a podman measurement.
        # Slice 4c adds TestLiveAttestationCreate, TestLiveAttestationStore,
        # TestLiveCanonicalISO, TestLiveProvenanceReceipt,
        # TestLiveProvenanceBinding, TestLiveGhAttestation,
        # TestLiveProvenanceWrite, TestLiveRepairEvidencePacket,
        # TestLiveValidateRepairBrief, TestLiveExtractOpenAiResponseText,
        # TestLiveRepairBriefJSONSchema, TestLiveProposeRepairBrief,
        # TestLiveResponseDecoders, TestLiveRepairBriefStore,
        # TestLiveRepairWorktree, TestLiveResolveCodexRunner,
        # TestLiveImplementCodexRunner, TestLiveRepairWithCodex,
        # TestLiveCpSyncTree and TestLiveHardGuardDigests (the run listing
        # picks them up). Measured locally in localhost/r73img (linux/arm64,
        # Node 22.22.2, uid 1000), in bounded windows: about 85 s of test
        # time for the 18-test historical selection of the window run (the CI list
        # below names 20 tests) (TestLiveRepairWithCodex
        # 16 s, TestLiveCpSyncTree 14 s, the rest under 7 s each). The
        # whole job has NOT been measured on CI, so none moves to
        # difftest-live-writers yet; do that if the job nears its 90 minutes.
        # requireReachedGroup judges the attest, provenance and repair files
        # only when all their tests ran in one process, which is this step;
        # the check below fails the step when one reports LIVE-GROUP-UNVERIFIED.
        # Slice 5b.1 adds TestLiveDemoArtifacts (the 26 analysis, render and
        # preview-CLI requests) and TestLiveDemoWriter (the 19 demo-v2 writer
        # requests plus the supplemental supplied-value table, with every
        # Go-written bundle verified by Go and by frozen TS) through the same
        # derivation. Their CI durations are not measured; locally in the pinned
        # Node 22.22.2 linux/arm64 image each took about 3 seconds of test time.
        # TestLiveDemoArtifactFaults (Linux and strace) is listed in elsewhere
        # and runs in difftest-live-faults, where strace is installed.
        run: |
          unset FAULTLINE_TURNSNAP_CASES
          set -o pipefail
          status=0
          elsewhere='TestLiveInvestigate TestLiveMinimize TestLiveMinimizationVerify TestLiveProofWriter TestLiveWriterFaults TestLiveRealDocker TestLiveRealDockerProjectBuild TestLiveDemoArtifactFaults'
          go test -tags faultline_test -list 'TestLive' ./difftest/ | grep -E '^Test' | grep -vxF -f <(printf '%s\n' $elsewhere) > "$RUNNER_TEMP/live.list"
          tests=$(paste -sd '|' "$RUNNER_TEMP/live.list")
          FAULTLINE_NODE_ORACLE=1 go test -tags faultline_test -count=1 ./difftest/ -run "^($tests)\$" -v -timeout 60m | tee "$RUNNER_TEMP/live.log" || status=$?
          .github/scripts/check-skips.sh "$RUNNER_TEMP/live.log" '^(TestLiveCwdErrorsMatchNode/(chroot|self0600|parent0311|locked[0-9]+)|TestLiveTmpdirSetidMatchesNode|TestLiveFuseMatchesNode|TestLiveTurnProofWriterAggregate)$' "$RUNNER_TEMP/live.list" || status=1
          if grep -q 'LIVE-GROUP-UNVERIFIED' "$RUNNER_TEMP/live.log"; then
            grep 'LIVE-GROUP-UNVERIFIED' "$RUNNER_TEMP/live.log" | head -5 | while read -r line; do echo "::error title=live group::$line"; done
            status=1
          fi
          exit $status
      - name: Measured stack depths
        # TestLiveStackThresholdsMatchNode runs in the step above on
        # linux/amd64: annotate what TS and Go reached at every site,
        # including the unstable init sites' band (KNOWN_DIFFERENCES), as
        # the stack-live job does for its platforms.
        if: always()
        run: |
          grep -E '^ *stack_live_test\.go:[0-9]+: [a-z0-9]+/[a-z0-9_]+ ' "$RUNNER_TEMP/live.log" | sed 's/^ *stack_live_test\.go:[0-9]*: //' |
            awk '{ key = $1 " " $2; $1 = ""; $2 = ""; sub(/^ +/, ""); rows[key] = rows[key] (rows[key] == "" ? "" : "; ") $0; if (!(key in seen)) { seen[key] = 1; order[++n] = key } }
                 END { for (i = 1; i <= n; i++) print order[i] " " rows[order[i]] }' |
            while read -r line; do echo "::notice title=stack depth::$line"; done
          grep -E 'stack_live_test\.go:[0-9]+: .*(unexpected output|lacks)' "$RUNNER_TEMP/live.log" | head -5 | while read -r line; do echo "::warning title=stack site::$line"; done
      - name: Install FUSE
        # TestLiveFuseMatchesNode mounts bundles through a FUSE filesystem
        # that misreports d_ino, d_type, sizes and errors.
        run: sudo apt-get install -y -qq fuse3 libfuse2t64 python3-fusepy libcap2-bin
      - name: Cases that need root (chroot, setuid, FUSE)
        # A test binary built as the runner user, run as root with its own
        # Go cache, so the runner's cache stays writable.
        run: |
          go test -tags faultline_test -c -o "$RUNNER_TEMP/difftest.test" ./difftest/
          # The setuid-nobody cases run node dist/cli.js as nobody: every
          # directory above the checkout must be searchable (the runner's
          # home is 0750).
          d="$GITHUB_WORKSPACE"; while [ "$d" != / ]; do sudo chmod o+x "$d"; d=$(dirname "$d"); done
          sudo chmod -R o+rX "$GITHUB_WORKSPACE/dist" "$GITHUB_WORKSPACE/node_modules" "$GITHUB_WORKSPACE/package.json"
          # Ubuntu 24.04's glibc (2.39) lists d_ino 0 entries, so the FUSE
          # case that needs Node on glibc <= 2.36 skips (KNOWN_DIFFERENCES).
          set -o pipefail
          status=0
          printf '%s\n' TestLiveCwdErrorsMatchNode TestLiveTmpdirSetidMatchesNode TestLiveFuseMatchesNode > "$RUNNER_TEMP/root.list"
          (cd difftest && sudo -E env "PATH=$PATH" GOCACHE="$RUNNER_TEMP/root-gocache" FAULTLINE_NODE_ORACLE=1 FAULTLINE_REQUIRE_ROOT=1 \
            "$RUNNER_TEMP/difftest.test" -test.run 'TestLiveCwdErrorsMatchNode|TestLiveTmpdirSetidMatchesNode|TestLiveFuseMatchesNode' -test.count=1 -test.v) | tee "$RUNNER_TEMP/root.log" || status=$?
          .github/scripts/check-skips.sh "$RUNNER_TEMP/root.log" '^TestLiveFuseMatchesNode/zero-declared-demo$' "$RUNNER_TEMP/root.list" || status=1
          exit $status
      - name: Internal and oracle-client tests against Node
        # TestLiveReleaseClock (difftest/release, untagged: a release build
        # with the wall clock) also runs in the go job, Go side only.
        run: |
          set -o pipefail
          status=0
          printf '%s\n' TestSortMatchesV8 TestToNumberMatchesNode TestEchoRoundTripsLoneSurrogate TestLiveReleaseClock > "$RUNNER_TEMP/internal.list"
          FAULTLINE_NODE_ORACLE=1 go test -count=1 ./internal/v8sort/ ./internal/jsjson/ ./difftest/oracle/ ./difftest/release/ -run '^(TestSortMatchesV8|TestToNumberMatchesNode|TestEchoRoundTripsLoneSurrogate|TestLiveReleaseClock)$' -v | tee "$RUNNER_TEMP/internal.log" || status=$?
          .github/scripts/check-skips.sh "$RUNNER_TEMP/internal.log" '^$' "$RUNNER_TEMP/internal.list" || status=1
          exit $status

  difftest-live-investigate:
    name: difftest live investigate (frozen TS oracle)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # Pinned: the collation data (ICU 78), the stack calibration
          # (internal/jsjson/stack.go) and the writer goldens follow this
          # Node release.
          node-version: "22.22.2"
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: TestLiveInvestigate
        # 40 generated repositories, both sides, up to 20 states each with fake Dockers (~30 min).
        run: |
          set -o pipefail
          status=0
          tests='TestLiveInvestigate'
          printf '%s\n' $tests > "$RUNNER_TEMP/live.list"
          FAULTLINE_NODE_ORACLE=1 go test -tags faultline_test -count=1 ./difftest/ -run "^($(echo $tests | tr ' ' '|'))\$" -v -timeout 60m | tee "$RUNNER_TEMP/live.log" || status=$?
          .github/scripts/check-skips.sh "$RUNNER_TEMP/live.log" '^$' "$RUNNER_TEMP/live.list" || status=1
          exit $status

  difftest-live-writers:
    name: difftest live writers (frozen TS oracle)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # Pinned: the collation data (ICU 78), the stack calibration
          # (internal/jsjson/stack.go) and the writer goldens follow this
          # Node release.
          node-version: "22.22.2"
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Minimization and proof writer
        # minimizeGitDiff, verifyGitMinimizationResult and writeGitInvestigationProofBundle against TS (~25 min).
        run: |
          set -o pipefail
          status=0
          tests='TestLiveMinimize TestLiveMinimizationVerify TestLiveProofWriter'
          printf '%s\n' $tests > "$RUNNER_TEMP/live.list"
          FAULTLINE_NODE_ORACLE=1 go test -tags faultline_test -count=1 ./difftest/ -run "^($(echo $tests | tr ' ' '|'))\$" -v -timeout 60m | tee "$RUNNER_TEMP/live.log" || status=$?
          .github/scripts/check-skips.sh "$RUNNER_TEMP/live.log" '^$' "$RUNNER_TEMP/live.list" || status=1
          exit $status

  difftest-live-replay:
    name: difftest live writer replay (frozen TS oracle)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # Pinned: the collation data (ICU 78), the stack calibration
          # (internal/jsjson/stack.go) and the writer goldens follow this
          # Node release.
          node-version: "22.22.2"
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Writer replay with TS cross-verification, same directory, end to end
        # With the oracle on, every bundle Go writes is also verified by frozen TS (spec 2.4),
        # including the incident continue bundles and prevention packages of slice 3b.
        run: |
          set -o pipefail
          status=0
          tests='TestWriterReplay TestThreadIDsBindUnderRoot TestInvestigateRefusalLeavesNoStage TestEndToEndWithoutNode TestEndToEndSlice3aWithoutNode TestEndToEndSlice3bWithoutNode TestEndToEndSlice4aWithoutNode TestEndToEndSlice4bWithoutNode TestEndToEndSlice4cWithoutNode TestWriterSameDirectory'
          printf '%s\n' $tests > "$RUNNER_TEMP/live.list"
          # The cross-verify guard's own synthetic regression (positive, zero,
          # absent and foreign summaries), before the long run: it fails fast.
          .github/scripts/check-crossverify-test.sh
          FAULTLINE_NODE_ORACLE=1 go test -tags faultline_test -count=1 ./difftest/ -run "^($(echo $tests | tr ' ' '|'))\$" -v -timeout 75m | tee "$RUNNER_TEMP/live.log" || status=$?
          .github/scripts/check-skips.sh "$RUNNER_TEMP/live.log" '^$' "$RUNNER_TEMP/live.list" || status=1
          # The oracle is on, so TestWriterReplay must report a positive count
          # of Go bundles verified by TS (a zero or missing summary fails).
          .github/scripts/check-crossverify.sh "$RUNNER_TEMP/live.log" || status=1
          exit $status

  # Split from difftest-live-replay in slice 3a: the writer fault matrix grew
  # to about 13 minutes of strace cases with the init --yes paths (577 s on
  # CI in slice 3a). Slice 3b's incident and prevention writer paths add
  # about 5 minutes, well inside the 60 minute go test timeout. Slice 4b adds
  # the turns-proof and turns-minimize rows (75 turn cases; the index-pack
  # file row runs under the fail-unpack fake git; the verifier's
  # temporary-repository mkdir and the binding rewrite's close use per-side
  # call ordinals, see faultOrdinals); slice 4c adds 111 cases (attest,
  # provenance, repair brief, witness implement overlay and the repair
  # command; repair-bundle-codex-ok faults only its repair invocation) and
  # slice 4a 102 (record, codex snapshot and sidecar rows;
  # sidecar-hook-full-turn faults only its last hook: faultLastInvocation).
  # The union has 654 cases (549 path-and-syscall-group pairs by 3 errnos in
  # writerFaultPaths, 102 in writerFaultPaths4a and the 3 doctor every-call
  # rows), counted from the table rows; no CI or local duration of the union
  # is measured, so the 60 minute go test timeout stays the number to check.
  # That 654 is the unchanged TestLiveWriterFaults matrix. Slice 5b.1 adds a
  # separate TestLiveDemoArtifactFaults suite (the demo-v2 writer's stage,
  # replacement and rollback rows, plus the preview-write and preview-overwrite
  # rows of the real judge-preview CLI, and the canonical-shim contract it runs
  # first) with its own count and duration; no combined count or duration is
  # claimed, and neither has been measured on CI.
  difftest-live-faults:
    name: difftest live writer faults and real Docker (frozen TS oracle)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # Pinned: the collation data (ICU 78), the stack calibration
          # (internal/jsjson/stack.go) and the writer goldens follow this
          # Node release.
          node-version: "22.22.2"
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install strace
        # TestLiveWriterFaults fails single syscalls on the writer paths with
        # strace -e inject; it fails rather than skips without strace in CI.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq strace
      - name: Docker's classic image store
        # TestLiveRealDockerProjectBuild's case is a local build with no
        # RepoDigest (PROJECT_IMAGE_BUILT_NEEDS_REGISTRY_DIGEST), which only
        # the classic store gives; the containerd store (Docker 29's default)
        # records one. Turn the containerd snapshotter off before the pull, so
        # the pinned image lands in the store the tests read, and check it.
        run: |
          sudo python3 -I -c 'import json, os; p = "/etc/docker/daemon.json"; d = json.load(open(p)) if os.path.exists(p) else {}; d.setdefault("features", {})["containerd-snapshotter"] = False; json.dump(d, open(p, "w"), indent=2)'
          cat /etc/docker/daemon.json
          sudo systemctl restart docker
          docker version --format 'client {{.Client.Version}} server {{.Server.Version}}'
          status=$(docker info --format '{{.Driver}} {{json .DriverStatus}}')
          echo "$status"
          case "$status" in *io.containerd.snapshotter*) echo "::error title=docker store::the containerd image store is still on"; exit 1 ;; esac
      - name: Pull the pinned image
        # TestLiveRealDocker runs investigate against the real daemon with
        # --pull never; TestLiveRealDockerProjectBuild builds FROM it.
        run: docker pull node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
      - name: GLOBALOPEN helper native controls (native, before the writer matrix)
        # The ordinary first-open fault rows of TestLiveWriterFaults run under
        # the test-only ptrace helper difftest/testdata/globalopen (stock strace
        # counts the first call per tracee and cannot express one tree-wide
        # first open). This step proves the helper natively on this runner
        # BEFORE the 654-case matrix: first the default-built helper against its
        # adversarial fixture and the real verifier (30 scenarios, the /dev/full
        # control and the nine verifier corruptions), then the hook-tagged
        # lifecycle controls (regression, residual, non-leader exec, log
        # controls, ledger). No hooks exist in the default helper. Raw stdout
        # and stderr are kept for the artifact step below; the exit status of
        # every go test is preserved and an unexpected skip fails the step.
        run: |
          set -o pipefail
          status=0
          mkdir -p "$RUNNER_TEMP/globalopen-proof"
          p="$RUNNER_TEMP/globalopen-proof"
          { echo "uname: $(uname -srm)"; echo "go: $(go version)"; echo "strace: $(strace --version 2>&1 | head -1)"; } | tee "$p/identity.txt"
          default_tests='TestGlobalOpenDefaultHelperScenarios TestGlobalOpenHeaderMarkerScenario TestGlobalOpenFixtureEvidenceRetention TestGlobalOpenDevFullIsToolFailure TestGlobalOpenVerifierRejectsCorruptions TestGlobalOpenOverrideValidation TestValidateGlobalOpenTrace TestValidateGlobalOpenTraceAcceptsReconciledNonPendingLoss TestGlobalOpenCommand TestGlobalOpenRowClassification'
          printf '%s\n' $default_tests > "$p/default.list"
          # Fixture scenarios keep their raw trace.log/child.out (success and
          # failure) under the same evidence directory the writer step uses, so
          # the existing always-upload step collects them.
          mkdir -p "$RUNNER_TEMP/globalopen-evidence"
          FAULTLINE_GLOBALOPEN_EVIDENCE_DIR="$RUNNER_TEMP/globalopen-evidence" go test -tags faultline_test -count=1 -timeout 15m -v -run "^($(echo $default_tests | tr ' ' '|'))\$" ./difftest/ > "$p/default.stdout" 2> "$p/default.stderr" || status=$?
          cat "$p/default.stdout"; cat "$p/default.stderr" >&2
          .github/scripts/check-skips.sh "$p/default.stdout" '^$' "$p/default.list" || status=1
          tags='globalopen_hooks,globalopen_residual,nonleader_exec_staged,log_controls,ledger_staged'
          go test -tags "$tags" -list '.*' ./difftest/testdata/globalopen/ | grep -E '^Test' > "$p/hooks.list" || status=1
          go test -tags "$tags" -count=1 -timeout 15m -v ./difftest/testdata/globalopen/ > "$p/hooks.stdout" 2> "$p/hooks.stderr" || status=$?
          cat "$p/hooks.stdout"; cat "$p/hooks.stderr" >&2
          .github/scripts/check-skips.sh "$p/hooks.stdout" '^$' "$p/hooks.list" || status=1
          exit $status
      - name: Writer faults, real Docker
        # FAULTLINE_REAL_DOCKER_CLASSIC_STORE=1 makes
        # TestLiveRealDockerProjectBuild fail unless the daemon recorded no
        # RepoDigest, so the NEEDS_REGISTRY_DIGEST comparison is what ran.
        run: |
          set -o pipefail
          status=0
          # TestLiveWriterFaults has 654 cases (see difftest-live-faults'
          # comment): slice 4a's 102 (record- 39, codex- 24, sidecar- 39) took
          # 26 s, 11 s and 96 s in podman as uid 1000 when run alone. Every
          # group of the spec 2.6 table fired, so none was dropped.
          # TestLiveDemoArtifactFaults is named here and in difftest-live's
          # elsewhere list, so it runs once, where strace is installed, and
          # check-skips.sh '^$' fails if it (or its canonical-shim subtest)
          # is skipped.
          tests='TestLiveWriterFaults TestLiveRealDocker TestLiveRealDockerProjectBuild TestLiveDemoArtifactFaults'
          printf '%s\n' $tests > "$RUNNER_TEMP/live.list"
          # The ordinary first-open rows retain every raw GLOBALOPEN trace (passed
          # or failed) and its metadata here for the artifact step below.
          mkdir -p "$RUNNER_TEMP/globalopen-evidence"
          FAULTLINE_GLOBALOPEN_EVIDENCE_DIR="$RUNNER_TEMP/globalopen-evidence" FAULTLINE_REAL_DOCKER=1 FAULTLINE_REAL_DOCKER_CLASSIC_STORE=1 FAULTLINE_NODE_ORACLE=1 go test -tags faultline_test -count=1 ./difftest/ -run "^($(echo $tests | tr ' ' '|'))\$" -v -timeout 60m | tee "$RUNNER_TEMP/live.log" || status=$?
          .github/scripts/check-skips.sh "$RUNNER_TEMP/live.log" '^$' "$RUNNER_TEMP/live.list" || status=1
          exit $status
      - name: Retain GLOBALOPEN proof artifacts
        # Raw stdout, stderr and traces are kept whether the steps above passed
        # or failed. An upload problem is reported but must not hide a test
        # failure (continue-on-error), and a missing path warns instead of
        # failing a run that has nothing to keep.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: globalopen-proof
          path: |
            ${{ runner.temp }}/globalopen-proof
            ${{ runner.temp }}/globalopen-evidence
            ${{ runner.temp }}/live.log
          if-no-files-found: warn
          retention-days: 14

  stack-live:
    # The V8 stack, spread and rimraf limits are fitted per platform
    # (internal/jsjson/stack.go); check them against the pinned Node on the
    # other platforms they model, with the signal, stdout, stderr and
    # RLIMIT_NOFILE emulation. On macOS the rimraf chain cannot reach V8's
    # depth (PATH_MAX), and the signal and stdout scenarios that read /proc
    # or Linux devices skip; the group-signal, NOFILE and stderr tests run.
    # The slice 2 live tests that need no /proc run here too: the judge-proof
    # server, its signal stop and browser opener, the seed preload, async
    # spawn and hardened git, and materialization (on macOS a case-colliding
    # tree takes the "Could not verify materialized Git tree" refusal).
    # Slice 3a adds the host-command runner, the project build-context walk
    # (on macOS without the sparse 256 MiB case, which is Linux only) and
    # turn-snapshot capture (all 150 cases: FAULTLINE_TURNSNAP_CASES unset).
    # Slice 3b adds incident suggest (real repositories: the /var ->
    # /private/var realpath, isInsideDirectory's dev/ino fallback through
    # the darwin StatIdentity) and the incident draft store (about 80 s and
    # 3 s on macOS); the prevention live tests are platform-neutral and stay
    # in difftest-live. Slice 4b adds TestLiveInvestigateTurns (turn
    # reconstruction, spec 4.1) and, through the two threshold tests, their
    # turn rows.
    # Slice 4a adds the sidecar hook state machine (TestLiveSidecarHooks): on
    # macOS /var is /private/var, so the storage realpath walk differs from
    # Linux (spec 4.1).
    # Slice 4c adds TestLiveResolveCodexRunner (existsSync and the PATH walk
    # differ by platform; macOS is the one that matters) and
    # TestLiveCpSyncTree (cpSync modes and the /private/var realpath). The
    # latter models Node's libstdc++ C++ copy and skips on macOS, whose
    # libc++ differs (KNOWN_DIFFERENCES), so only the arm64 Linux leg runs it.
    name: stack thresholds vs Node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.22.2"
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Live platform tests
        run: |
          set -o pipefail
          status=0
          unset FAULTLINE_TURNSNAP_CASES
          tests='TestLiveInvestigateTurns TestLiveStackThresholdsMatchNode TestLiveServeBundleStackCallSites TestLiveSpreadLimitsMatchNode TestLiveRimrafDepthMatchesNode TestLiveStdoutMatchesNode TestLiveSignalsMatchNode TestLiveNofileMatchesNode TestLiveGroupSignalMatchesNode TestLiveStderrMatchesNode TestLiveJudgeServer TestLiveJudgeSignalStop TestLiveBrowserOpen TestLiveSeedPreload TestLiveSpawn TestLiveHardenedGit TestLiveMaterialize TestLiveHostCmd TestLiveProjectContext TestLiveTurnSnapshotCapture TestLiveIncidentSuggest TestLiveIncidentDraft TestLiveSidecarHooks TestLiveResolveCodexRunner TestLiveCpSyncTree'
          printf '%s\n' $tests > "$RUNNER_TEMP/live.list"
          FAULTLINE_NODE_ORACLE=1 go test -tags faultline_test -count=1 ./difftest/ -run "^($(echo $tests | tr ' ' '|'))\$" -v -timeout 70m | tee "$RUNNER_TEMP/live.log" || status=$?
          if [ "$RUNNER_OS" = macOS ]; then allowed='^(TestLiveRimrafDepthMatchesNode|TestLiveSignalsMatchNode|TestLiveStdoutMatchesNode|TestLiveProjectContext/sparse256MiB|TestLiveCpSyncTree)$'; else allowed='^$'; fi
          .github/scripts/check-skips.sh "$RUNNER_TEMP/live.log" "$allowed" "$RUNNER_TEMP/live.list" || status=1
          exit $status
      - name: Measured stack depths
        # The CLI site's darwin/arm64 offset (jsjson.SiteCLI) was fitted from
        # an estimate: annotate what TS and Go reached at every site, so a
        # failing row can be refitted from the check run alone. One notice
        # per site (its four shapes on one line): GitHub keeps only ten
        # notices per step. The test measures the cli site first and also
        # logs an unexpected output there before failing.
        if: always()
        run: |
          grep -E '^ *stack_live_test\.go:[0-9]+: [a-z0-9]+/[a-z0-9_]+ ' "$RUNNER_TEMP/live.log" | sed 's/^ *stack_live_test\.go:[0-9]*: //' |
            awk '{ key = $1 " " $2; $1 = ""; $2 = ""; sub(/^ +/, ""); rows[key] = rows[key] (rows[key] == "" ? "" : "; ") $0; if (!(key in seen)) { seen[key] = 1; order[++n] = key } }
                 END { for (i = 1; i <= n; i++) print order[i] " " rows[order[i]] }' |
            while read -r line; do echo "::notice title=stack depth::$line"; done
          grep -E 'stack_live_test\.go:[0-9]+: .*(unexpected output|lacks)' "$RUNNER_TEMP/live.log" | head -5 | while read -r line; do echo "::warning title=stack site::$line"; done
      - name: TimSort against V8
        run: |
          set -o pipefail
          status=0
          FAULTLINE_NODE_ORACLE=1 go test -count=1 ./internal/v8sort/ -run TestSortMatchesV8 -v | tee "$RUNNER_TEMP/v8sort.log" || status=$?
          echo TestSortMatchesV8 > "$RUNNER_TEMP/v8sort.list"
          .github/scripts/check-skips.sh "$RUNNER_TEMP/v8sort.log" '^$' "$RUNNER_TEMP/v8sort.list" || status=1
          exit $status

  # Slice 5c: `fl serve --bundle` natively on all six targets against the frozen
  # TypeScript CLI. The ordinary difftest-live job above still discovers every
  # TestLive* (including these) on ubuntu amd64 and is not narrowed; this job
  # exists because that job, the stack-live job and the go matrix together do not
  # run the oracle comparison on Windows, Darwin or Linux arm64. It runs only
  # supported paths: no test here may skip except the exact Windows symlink and
  # POSIX-mode identities audited by check-serve-bundle-skip-reasons.sh. The
  # recorded evidence is the actual TS and Go output of all 73 cases (68
  # original, 5 supplemental binding), the launched fl binary's own hash and the
  # native identity; none of it comes from a cross-build, a container emulation
  # or an earlier head.
  serve-bundle-native:
    name: serve --bundle native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Six explicit legs, each with its INTENDED target. The identity test and
      # the later audit both read that same independent pair (test-only context;
      # it never overrides GOOS/GOARCH or how anything runs) and fail if the
      # runner, the Go toolchain or the launched fl is any other target.
      matrix:
        include:
          - { os: ubuntu-24.04, goos: linux, goarch: amd64 }
          - { os: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
          - { os: macos-latest, goos: darwin, goarch: arm64 }
          - { os: macos-15-intel, goos: darwin, goarch: amd64 }
          - { os: windows-latest, goos: windows, goarch: amd64 }
          - { os: windows-11-arm, goos: windows, goarch: arm64 }
    env:
      LC_ALL: C.UTF-8
      FAULTLINE_EVIDENCE_EXPECT_GOOS: ${{ matrix.goos }}
      FAULTLINE_EVIDENCE_EXPECT_GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # Pinned: the oracle is Node 22.22.2 (the tests pin its actual version).
          node-version: "22.22.2"
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Record the checked-out identity
        # The head of the tree actually checked out (for a pull request this is
        # the merge ref's commit) and, separately, the event's own head: they
        # are recorded as two facts and never equated.
        shell: bash
        run: |
          set -eu
          head=$(git rev-parse HEAD)
          event_head="${{ github.event.pull_request.head.sha || github.sha }}"
          {
            echo "FAULTLINE_EVIDENCE_HEAD=$head"
            echo "FAULTLINE_EVIDENCE_EVENT=${{ github.event_name }}"
            echo "FAULTLINE_EVIDENCE_EVENT_HEAD=$event_head"
            echo "FAULTLINE_EVIDENCE_GITHUB_SHA=${{ github.sha }}"
            echo "FAULTLINE_SERVE_BUNDLE_EVIDENCE_DIR=$RUNNER_TEMP/serve-bundle-evidence"
          } >> "$GITHUB_ENV"
          echo "checked-out head $head, event ${{ github.event_name }}, event head $event_head, github.sha ${{ github.sha }}"
      - name: Native live comparison, permanent replay and evidence
        # Every test below is named, and check-skips.sh fails when a named
        # top-level test reports no result. TestLiveServeBundle must pass all 68
        # original cases and TestLiveServeBundleBinding the 5 supplemental ones
        # (check-serve-bundle-counts.sh counts them from the log). The identity
        # test hashes the real launched flBinary before TestMain removes it.
        # The Linux inherited-signal test exists only with cgo on Linux and
        # additionally proves the actual fl build's CGO_ENABLED=1 metadata.
        # Windows builds and runs the isolated-console helper natively
        # (serveBundleConsoleHelper) for the signal tests on both architectures.
        shell: bash
        run: |
          set -o pipefail
          status=0
          tests='TestLiveServeBundleEvidenceIdentity TestLiveServeBundle TestLiveServeBundleBinding TestLiveServeBundleStackCallSites TestLiveServeBundleSignals TestServeBundleCLIReplay TestServeBundleBindingCLIReplay TestServeBundleHTTP TestServeBundleStartupOrdinaryInterrupt TestServeBundleStartupRepeatedInterrupt'
          if [ "$RUNNER_OS" = Linux ]; then tests="$tests TestLiveServeBundleInheritedSignals"; fi
          # Windows only: the observational console-interrupt diagnostic
          # (baseline and clear-ignore variants of a tiny target). It runs in this
          # retained log and its failure fails the job.
          if [ "$RUNNER_OS" = Windows ]; then tests="$tests TestServeFixtureWindowsConsoleInterrupt"; fi
          printf '%s\n' $tests > "$RUNNER_TEMP/serve-live.list"
          # Never overwrite or delete an earlier capture, even after a failure.
          mkdir "$FAULTLINE_SERVE_BUNDLE_EVIDENCE_DIR" || exit 1
          FAULTLINE_NODE_ORACLE=1 go test -tags faultline_test -count=1 ./difftest/ -run "^($(echo $tests | tr ' ' '|'))\$" -v -timeout 100m | tee "$RUNNER_TEMP/serve-live.log" || status=$?
          # No test selected here may skip on any target (the Windows symlink and
          # POSIX-mode identities run in the full go matrix above, not here).
          .github/scripts/check-skips.sh "$RUNNER_TEMP/serve-live.log" '^$' "$RUNNER_TEMP/serve-live.list" || status=1
          .github/scripts/check-serve-bundle-counts.sh "$RUNNER_TEMP/serve-live.log" || status=1
          .github/scripts/check-serve-bundle-skip-reasons.sh "$RUNNER_TEMP/serve-live.log" "$RUNNER_OS" || status=1
          exit $status
      - name: Audit the recorded evidence
        # Validates the whole directory against the strictly loaded corpora: the
        # exact 68 original and 5 supplemental case ids on both sides with their
        # raw streams, status and pages, the launched binary's hash, the runner,
        # go env, Node and head identity. The marker line is printed only by a
        # complete audit.
        shell: bash
        run: |
          set -o pipefail
          status=0
          printf '%s\n' TestServeBundleEvidenceAudit TestServeBundleEvidenceAuditControls > "$RUNNER_TEMP/serve-audit.list"
          FAULTLINE_SERVE_BUNDLE_EVIDENCE_AUDIT=1 go test -tags faultline_test -count=1 ./difftest/ -run '^(TestServeBundleEvidenceAudit|TestServeBundleEvidenceAuditControls)$' -v | tee "$RUNNER_TEMP/serve-audit.log" || status=$?
          .github/scripts/check-skips.sh "$RUNNER_TEMP/serve-audit.log" '^$' "$RUNNER_TEMP/serve-audit.list" || status=1
          grep -q 'SERVE-BUNDLE-EVIDENCE-AUDIT ok' "$RUNNER_TEMP/serve-audit.log" || { echo "::error title=evidence audit::no complete audit marker"; status=1; }
          exit $status
      - name: Standalone release binary without Node (trusted Git present)
        # The untagged release binary, outside the repository, with a PATH that
        # holds real Git and no node/npm/pnpm/tsx launcher (TestServeBundleStandalone
        # verifies every PATH entry), on this native target.
        shell: bash
        run: |
          set -o pipefail
          status=0
          echo TestServeBundleStandalone > "$RUNNER_TEMP/standalone.list"
          go test -count=1 ./difftest/release/ -run '^TestServeBundleStandalone$' -v -timeout 40m | tee "$RUNNER_TEMP/standalone.log" || status=$?
          .github/scripts/check-skips.sh "$RUNNER_TEMP/standalone.log" '^$' "$RUNNER_TEMP/standalone.list" || status=1
          exit $status
      - name: Retain the serve --bundle native evidence
        # Required evidence is retained even on failure. An upload failure also
        # fails this job; it never turns an earlier failure into success.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serve-bundle-native-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/serve-bundle-evidence
            ${{ runner.temp }}/serve-live.log
            ${{ runner.temp }}/serve-audit.log
            ${{ runner.temp }}/standalone.log
          if-no-files-found: error
          retention-days: 14

  # Slice 5c diagnostic: a small, fast, independent native Windows job that runs
  # ONLY the console Ctrl+C origin experiment (baseline, target-side
  # clear-ignore, and the last parent-clear variant), so its raw log is
  # inspectable long before the full native suites finish. It is a normal
  # strict job: any failing variant fails it, there is no continue-on-error and
  # no alternate accepted outcome. Before the test launcher cleared its own
  # inherited Ctrl+C-ignore attribute, a failing baseline was the expected,
  # retained symptom (retained native logs on both Windows architectures); after
  # that correction ALL THREE variants must pass, and a failing variant remains a
  # real failure. It proves nothing about overall readiness and does not replace
  # or weaken any other job.
  windows-console-diagnostic:
    name: windows console Ctrl+C diagnostic (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
      - name: Console Ctrl+C origin experiment
        shell: bash
        run: |
          set -o pipefail
          status=0
          {
            echo "runner: os=$RUNNER_OS arch=$RUNNER_ARCH image=${{ matrix.os }}"
            go version
            echo "event=${{ github.event_name }} sha=$(git rev-parse HEAD)"
          } 2>&1 | tee "$RUNNER_TEMP/console-diagnostic.log"
          go test -tags faultline_test -count=1 -v -timeout 3m -run '^TestServeFixtureWindowsConsoleInterrupt$' ./difftest/ 2>&1 | tee -a "$RUNNER_TEMP/console-diagnostic.log" || status=$?
          # Guards (go test exiting 0 is not trusted alone). check-skips.sh fails on
          # an unexpected skip, "no tests to run" and a named top-level test that
          # reported no result, so a renamed or unmatched test cannot pass. It only
          # annotates a failed test and does not itself return nonzero for a FAIL;
          # the original go test status, preserved above, is what keeps a failing
          # variant failing. Its output goes to a SEPARATE file that is appended to
          # the retained log afterwards, never read and written through one pipeline.
          printf '%s\n' TestServeFixtureWindowsConsoleInterrupt > "$RUNNER_TEMP/console-diagnostic.list"
          .github/scripts/check-skips.sh "$RUNNER_TEMP/console-diagnostic.log" '^$' "$RUNNER_TEMP/console-diagnostic.list" > "$RUNNER_TEMP/console-guard.out" 2>&1 || status=1
          # Each variant must have an actual terminal result (PASS or FAIL,
          # indentation allowed) under its exact full subtest name; a missing one
          # fails the job.
          for variant in baseline clear-ignore clear-in-launcher; do
            name="TestServeFixtureWindowsConsoleInterrupt/$variant"
            if ! grep -Eq "^[[:space:]]*--- (PASS|FAIL): $name \(" "$RUNNER_TEMP/console-diagnostic.log"; then
              echo "::error title=console diagnostic::no PASS or FAIL terminal for $name" >> "$RUNNER_TEMP/console-guard.out"
              status=1
            fi
          done
          cat "$RUNNER_TEMP/console-guard.out"
          cat "$RUNNER_TEMP/console-guard.out" >> "$RUNNER_TEMP/console-diagnostic.log"
          exit $status
      - name: Retain the console diagnostic log
        # Retained even on failure; a missing file fails this step.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-console-diagnostic-${{ github.event_name }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/console-diagnostic.log
          if-no-files-found: error
          retention-days: 14
