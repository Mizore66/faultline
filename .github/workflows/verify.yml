name: Verify FaultLine

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      unfreeze_override:
        description: "Allow src/package.json/pnpm-lock.yaml changes while SUBMISSION_FROZEN exists"
        required: false
        default: false
        type: boolean

jobs:
  submission-freeze:
    name: submission freeze guard (C-1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          # Classifier is plain node — do not require pnpm from packageManager.
          package-manager-cache: false
      - name: Classify changed paths under SUBMISSION_FROZEN
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          UNFREEZE: ${{ github.event_name == 'workflow_dispatch' && inputs.unfreeze_override || false }}
        run: |
          set -euo pipefail
          if [[ ! -f SUBMISSION_FROZEN ]]; then
            echo "SUBMISSION_FROZEN absent — freeze guard inactive."
            exit 0
          fi
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${UNFREEZE}" == "true" ]]; then
            echo "unfreeze_override=true — freeze guard skipped for this dispatch."
            exit 0
          fi
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif [[ "${EVENT_NAME}" == "push" && "${REF}" == "refs/heads/main" ]]; then
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [[ "${BASE}" == "0000000000000000000000000000000000000000" ]]; then
              echo "Initial push — freeze guard inactive."
              exit 0
            fi
          else
            echo "Event ${EVENT_NAME} on ${REF} — freeze guard not enforced."
            exit 0
          fi
          mapfile -t PATHS < <(git diff --name-only "${BASE}" "${HEAD}" || true)
          if [[ ${#PATHS[@]} -eq 0 ]]; then
            echo "No changed paths."
            exit 0
          fi
          set +e
          node scripts/submission-freeze-guard.mjs --classify "${PATHS[@]}"
          STATUS=$?
          set -e
          if [[ "${STATUS}" -eq 2 ]]; then
            echo "::error::SUBMISSION_FROZEN blocks changes under src/**, package.json, or pnpm-lock.yaml. Docs/tests-only changes are allowed. Override via workflow_dispatch unfreeze_override=true."
            exit 1
          fi
          exit "${STATUS}"
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-tags: true
          # Full history so package-smoke can assert the submission pin is an ancestor of HEAD.
          fetch-depth: 0
      # The exact pnpm version is pinned in package.json.
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production dependency audit (non-blocking)
        run: pnpm audit --prod
        continue-on-error: true
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm coverage-matrix
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: faultline-coverage-matrix-${{ matrix.os }}-node${{ matrix.node }}
          if-no-files-found: error
          path: |
            benchmarks/REPORT.md
            benchmarks/report.json
      - run: pnpm pack --dry-run
      - run: pnpm test:package
      - run: node dist/cli.js judge-demo --rerun-all --export-only
      - run: node dist/cli.js verify .faultline/bundles/judge-demo

  docker-integration:
    name: native Docker proof E2E gate (${{ matrix.imageFamily }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - imageFamily: alpine
            nodeTag: node:22-alpine
          - imageFamily: debian-bookworm
            nodeTag: node:22-bookworm
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-tags: true
          fetch-depth: 0
      # The exact pnpm version is pinned in package.json.
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production dependency audit (non-blocking)
        run: pnpm audit --prod
        continue-on-error: true
      - run: pnpm build
      - name: Native Docker E2E tests only
        run: pnpm exec vitest run tests/docker-integration.test.ts tests/later-turn-ledger-fixture.test.ts
        env:
          FAULTLINE_DOCKER_INTEGRATION: "1"
          FAULTLINE_LIVE_TURN_MINIMIZE: "1"
          FAULTLINE_DOCKER_NODE_TAG: ${{ matrix.nodeTag }}
      - name: Regenerate coverage matrix with Docker E2E rows
        if: matrix.imageFamily == 'alpine'
        run: pnpm coverage-matrix
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: faultline-coverage-matrix-docker-e2e-${{ matrix.imageFamily }}
          if-no-files-found: error
          path: |
            benchmarks/REPORT.md
            benchmarks/report.json
            benchmarks/e2e-executed.json

  # RIG-07: second-kernel Docker proof gate (Windows host + Docker Engine).
  # Skips cleanly when Docker is unavailable on the runner.
  docker-integration-windows:
    name: native Docker proof E2E gate (windows-host)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check Docker availability
        id: docker
        shell: pwsh
        run: |
          $available = "false"
          docker version 2>&1 | Out-Host
          if ($LASTEXITCODE -eq 0) {
            docker pull node:22-alpine 2>&1 | Out-Host
            if ($LASTEXITCODE -eq 0) {
              $available = "true"
            } else {
              Write-Host "Docker image pull failed on this Windows runner; RIG-07 gate skipped."
            }
          } else {
            Write-Host "Docker unavailable on this Windows runner; RIG-07 gate skipped."
          }
          "available=$available" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # Never fail the job from this probe — skip E2E when unavailable.
          exit 0
      - name: Native Docker E2E on Windows host kernel
        if: steps.docker.outputs.available == 'true'
        shell: pwsh
        run: pnpm exec vitest run tests/docker-integration.test.ts -t "eight coverage-matrix"
        env:
          FAULTLINE_DOCKER_INTEGRATION: "1"
          FAULTLINE_DOCKER_NODE_TAG: "node:22-alpine"
      - name: Upload Windows E2E coverage facts
        if: steps.docker.outputs.available == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: faultline-coverage-matrix-docker-e2e-windows-host
          if-no-files-found: warn
          path: |
            benchmarks/REPORT.md
            benchmarks/report.json
            benchmarks/e2e-executed.json

  # Experimental second-kernel Docker gate via Colima on macOS.
  # continue-on-error: never red-blocks the pipeline. Do not claim macOS
  # coverage in docs unless this job produced an e2e-executed.json artifact.
  docker-integration-macos-colima:
    name: experimental native Docker E2E (macos-colima)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start Colima (experimental)
        id: colima
        shell: bash
        run: |
          set +e
          brew install colima docker 2>&1
          colima start --cpu 2 --memory 4 2>&1
          docker version 2>&1
          docker pull node:22-alpine 2>&1
          if [[ $? -eq 0 ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Colima/Docker unavailable on this macOS runner; experimental gate skipped."
          fi
          exit 0
      - name: Native Docker E2E on macOS Colima
        if: steps.colima.outputs.available == 'true'
        shell: bash
        run: pnpm exec vitest run tests/docker-integration.test.ts -t "eight coverage-matrix"
        env:
          FAULTLINE_DOCKER_INTEGRATION: "1"
          FAULTLINE_DOCKER_NODE_TAG: "node:22-alpine"
      - name: Upload experimental macOS E2E coverage facts
        if: steps.colima.outputs.available == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: faultline-coverage-matrix-docker-e2e-macos-colima
          if-no-files-found: warn
          path: |
            benchmarks/REPORT.md
            benchmarks/report.json
            benchmarks/e2e-executed.json

  tag-checkout:
    name: pinned tag judge-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: v0.1.9-buildweek
          fetch-tags: true
          fetch-depth: 0
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Judge-proof from pinned submission tag
        run: node dist/cli.js judge-proof --export-only
        env:
          FAULTLINE_NO_BROWSER: "1"

  provenance:
    name: signed GitHub CI provenance
    needs: [test, docker-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # The exact pnpm version is pinned in package.json.
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create a verified live proof and attestation subject
        shell: bash
        run: |
          mkdir -p .faultline
          node dist/cli.js demo live-git --export-only | tee .faultline/live-git-demo.json
          bundle="$(node -e "const result = JSON.parse(require('node:fs').readFileSync('.faultline/live-git-demo.json', 'utf8')); if (result.status !== 'DEMO_PROOF_READY') process.exit(1); process.stdout.write(result.proofBundle.directory);")"
          node dist/cli.js provenance create --bundle "$bundle" --output .faultline/provenance/ci-receipt.json
      - id: attest
        name: Sign the provenance receipt with GitHub artifact attestation
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: .faultline/provenance/ci-receipt.json
      - name: Publish proof, receipt, and offline verification collateral
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: faultline-ci-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            .faultline/provenance/ci-receipt.json
            .faultline/git-proof-bundles/
            ${{ steps.attest.outputs.bundle-path }}
